[project]
name = "hermes-kanban-webui"
version = "0.2.0"
description = "Standalone Trello-like WebUI for Hermes Kanban (RU/EN/KO, PWA, web-push)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-multipart",
  "pywebpush",
]

[project.urls]
Homepage = "https://github.com/r1290z/hermes-kanban-webui"
Repository = "https://github.com/r1290z/hermes-kanban-webui"
Issues = "https://github.com/r1290z/hermes-kanban-webui/issues"
Upstream = "https://github.com/PriuS2/HermesKanban"

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
